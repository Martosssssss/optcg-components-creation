<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buggy Card</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      position: relative;
      width: min(1826px, calc(100vw - 30px));
      height: 294px;
      overflow: visible;
      transform: scale(1.05);
      transform-origin: center;
    }

    .card-content {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 45px;
      background:
        linear-gradient(
          110deg,
          #ff5a00 0%,
          #ff5700 45%,
          #fa4c00 100%
        );
    }

    /* Zona naranja */
    .info {
      position: absolute;
      left: 0;
      top: 0;
      width: 67%;
      height: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding-right: 2%;
      color: white;
      z-index: 2;
    }

    .name {
      margin: 0;
      max-width: calc(100% - 48px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: clamp(58px, 5vw, 100px);
      line-height: 0.95;
      font-weight: 700;
      letter-spacing: -3px;
    }

    .code {
      margin-top: 22px;
      font-size: clamp(28px, 2.2vw, 51px);
      line-height: 1;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.55);
    }

    /* Imagen del personaje */
    .character {
      position: absolute;
      top: 0;
      right: 0;
      width: 33%;
      height: 100%;
      z-index: 1;

      background: url('../example_images/card.png') no-repeat center 12% / 125% auto;
    }

    /* Círculo x4 */
    .quantity {
      position: absolute;
      z-index: 5;

      top: -31px;
      right: -18px;

      width: 126px;
      height: 126px;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ff6b0b;
      color: white;

      font-size: 61px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -3px;
    }

    @media (max-width: 800px) {
      .card {
        height: 220px;
      }

      .info {
        width: 65%;
      }

      .character {
        width: 38%;
      }

      .name {
        letter-spacing: -2px;
      }

      .code {
        margin-top: 12px;
      }

      .quantity {
        width: 90px;
        height: 90px;
        top: -20px;
        right: -10px;
        font-size: 42px;
      }
    }

    @media (max-width: 520px) {
      .card {
        height: 170px;
      }

      .info {
        width: 62%;
      }

      .character {
        width: 42%;
      }

      .code {
        margin-top: 8px;
      }

      .quantity {
        width: 68px;
        height: 68px;
        top: -14px;
        right: -6px;
        font-size: 31px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="card-content">

      <div class="info">
        <h1 class="name">Buggy</h1>
        <div class="code">OP16-048</div>
      </div>

      <div class="character" role="img" aria-label="Buggy"></div>

    </div>

    <div class="quantity">x4</div>

  </div>

</body>
</html>
