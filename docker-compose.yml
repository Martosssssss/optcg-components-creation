services:
  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./back/components:/usr/share/nginx/components:ro
      - ./back/example_images:/usr/share/nginx/example_images:ro

  api:
    build: ./back
    environment:
      - API_CARD=https://www.optcgapi.com/api/sets/card/
      - OPTCG_MIN_INTERVAL=0.3
    volumes:
      - ./back/components:/app/components:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s